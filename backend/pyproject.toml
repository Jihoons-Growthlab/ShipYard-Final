[project]
name = "shipyard-backend"
version = "0.4.0"
description = "SWP Shipyard 통합관리 시스템 백엔드"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.162",
    "uvicorn>=0.54",
    "pyjwt>=2.15",
    "argon2-cffi>=25.1",
    "fpdf2>=2.8",
    "openpyxl>=3.1",
]

[project.scripts]
init-db = "app.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.2",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
